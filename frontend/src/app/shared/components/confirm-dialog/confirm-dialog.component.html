<ion-modal [isOpen]="isOpen" (ionModalDidDismiss)="onCancel()">
  <ion-header>
    <ion-toolbar>
      <ion-title>{{ title }}</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <p class="text-emily-dark">{{ message }}</p>
  </ion-content>
  <ion-footer>
    <ion-toolbar>
      <ion-buttons slot="primary" style="justify-content: space-between; width: 100%">
        <ion-button (click)="onCancel()" fill="outline">{{ cancelText }}</ion-button>
        <ion-button
          (click)="onConfirm()"
          [color]="type === 'danger' ? 'danger' : (type === 'warning' ? 'warning' : 'primary')"
          >{{ confirmText }}</ion-button
        >
      </ion-buttons>
    </ion-toolbar>
  </ion-footer>
</ion-modal>
