<ion-header>
  <ion-toolbar>
    <ion-title>Pago cancelado</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="max-w-md mx-auto flex items-center justify-center min-h-full">
    <div class="w-full text-center">
      <div class="bg-emily-white rounded-2xl p-8 shadow-lg">
        <div class="w-16 h-16 bg-emily-rose/20 rounded-full flex items-center justify-center mx-auto mb-4">
          <ion-icon name="close-circle" size="large" class="text-emily-rose"></ion-icon>
        </div>

        <h1 class="font-serif text-2xl text-emily-dark mb-2">Pago Cancelado</h1>
        <p class="text-emily-taupe mb-8">
          Tu pago ha sido cancelado. No se realizó ningún cargo a tu cuenta.
        </p>

        <div class="flex flex-col gap-2">
          <ion-button expand="block" color="dark" routerLink="/carrito">Volver al carrito</ion-button>
          <ion-button expand="block" fill="outline" color="medium" routerLink="/">Ir al inicio</ion-button>
        </div>
      </div>
    </div>
  </div>
</ion-content>
