<ion-header>
  <ion-toolbar class="ion-padding-horizontal">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ isEdit() ? 'Editar Estilo' : 'Nuevo Estilo' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (isLoading()) {
    <div class="flex items-center justify-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emily-rose"></div>
    </div>
  } @else {
    <div class="max-w-xl mx-auto space-y-6">
      <div class="bg-emily-white rounded-xl p-6 shadow-sm border border-emily-cream space-y-4">
        <!-- Nombre -->
        <div>
          <label class="block text-sm font-medium text-emily-dark mb-1">Nombre *</label>
          <input
            type="text"
            [value]="nombre()"
            (input)="nombre.set($any($event.target).value)"
            maxlength="50"
            placeholder="Ej: Casual, Formal, Deportivo..."
            class="w-full px-4 py-2 border border-emily-cream rounded-lg focus:ring-2 focus:ring-emily-rose focus:border-transparent transition-all"
          />
        </div>

        <!-- Descripción -->
        <div>
          <label class="block text-sm font-medium text-emily-dark mb-1">Descripción</label>
          <textarea
            [value]="descripcion()"
            (input)="descripcion.set($any($event.target).value)"
            maxlength="200"
            rows="2"
            placeholder="Opcional, máx 200 caracteres"
            class="w-full px-4 py-2 border border-emily-cream rounded-lg focus:ring-2 focus:ring-emily-rose focus:border-transparent transition-all resize-none"
          ></textarea>
        </div>

        <!-- Orden -->
        <div>
          <label class="block text-sm font-medium text-emily-dark mb-1">Orden de visualización</label>
          <input
            type="number"
            [value]="orden()"
            (input)="orden.set(+$any($event.target).value)"
            min="0"
            class="w-full px-4 py-2 border border-emily-cream rounded-lg focus:ring-2 focus:ring-emily-rose focus:border-transparent transition-all"
          />
        </div>

        <!-- Activo -->
        <div class="flex items-center gap-3">
          <button
            (click)="activo.set(!activo())"
            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
            [class]="activo() ? 'bg-emily-rose' : 'bg-gray-300'"
          >
            <span
              class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform"
              [class]="activo() ? 'translate-x-6' : 'translate-x-1'"
            ></span>
          </button>
          <span class="text-sm text-emily-dark">{{ activo() ? 'Activo' : 'Inactivo' }}</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex gap-3">
        <button
          (click)="cancel()"
          class="flex-1 px-4 py-3 rounded-xl border border-emily-cream text-emily-dark hover:bg-emily-light transition-colors font-medium"
        >
          Cancelar
        </button>
        <button
          (click)="save()"
          [disabled]="isSaving() || !nombre().trim()"
          class="flex-1 px-4 py-3 rounded-xl bg-emily-dark text-emily-white font-semibold hover:bg-emily-taupe transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ isSaving() ? 'Guardando...' : (isEdit() ? 'Actualizar' : 'Crear') }}
        </button>
      </div>
    </div>
  }
</ion-content>
