<ion-header>
  <ion-toolbar class="ion-padding-horizontal">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="space-y-6">
    <div class="bg-emily-white rounded-xl shadow-sm border border-emily-cream">
      <div class="p-6 border-b border-emily-cream">
        <h1 class="text-3xl font-serif font-bold text-emily-dark">Dashboard</h1>
        <p class="text-emily-taupe mt-1">
          Análisis y métricas de Emily Designs
        </p>
      </div>

      <ion-segment
        [value]="activeTab()"
        scrollable
        (ionChange)="selectTab($event.detail.value)"
      >
        @for (tab of tabs; track tab.id) {
          <ion-segment-button [value]="tab.id" [contentId]="tab.id">
            <ion-icon [name]="tab.icon"></ion-icon>
            <ion-label>{{ tab.label }}</ion-label>
          </ion-segment-button>
        }
      </ion-segment>
    </div>

    <ion-segment-view (ionSegmentViewScroll)="onSegmentViewScroll($event)">
      <ion-segment-content id="general">
        <app-general-tab />
      </ion-segment-content>
      <ion-segment-content id="productos">
        <app-products-tab />
      </ion-segment-content>
      <ion-segment-content id="clientes">
        <app-clients-tab />
      </ion-segment-content>
      <ion-segment-content id="ventas">
        <app-orders-tab />
      </ion-segment-content>
      <ion-segment-content id="analisis">
        <app-analysis-tab />
      </ion-segment-content>
    </ion-segment-view>
  </div>
</ion-content>
